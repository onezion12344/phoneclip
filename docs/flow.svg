<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="PhoneClip architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#131a26"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a78bfa"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <rect width="1200" height="560" fill="url(#grid)"/>
  <ellipse cx="600" cy="250" rx="420" ry="180" fill="#34d399" opacity="0.05" filter="url(#soft)"/>

  <!-- phone -->
  <rect x="56" y="118" width="312" height="268" rx="20" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="56" y="118" width="6" height="268" rx="3" fill="url(#mint)"/>
  <text x="84" y="160" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="600" fill="#e7ecf3">手机 · OneZion Clip</text>
  <text x="84" y="206" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">全相册照片监听</text>
  <text x="84" y="236" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">分享任意文件 → 双端剪贴板</text>
  <text x="84" y="266" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">快捷磁贴 · 文字发送</text>
  <text x="84" y="296" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">GitHub OTA 自更新</text>
  <text x="84" y="348" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#5f6b7d">前台服务 · 低功耗</text>

  <!-- transport -->
  <rect x="436" y="160" width="330" height="184" rx="20" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="464" y="204" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="600" fill="#e7ecf3">Tailscale / 局域网</text>
  <text x="464" y="240" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">:47411 · token 鉴权</text>
  <text x="464" y="270" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">长轮询：1 次 / 4 分钟</text>
  <text x="464" y="300" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">照片 1–3 秒到达</text>

  <!-- mac -->
  <rect x="832" y="118" width="312" height="268" rx="20" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="1138" y="118" width="6" height="268" rx="3" fill="url(#violet)"/>
  <text x="860" y="160" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="600" fill="#e7ecf3">Mac · PhoneClip.app</text>
  <text x="860" y="206" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">Swift · Network.framework</text>
  <text x="860" y="236" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">NSPasteboard 读写</text>
  <text x="860" y="266" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">右上角浮窗提示</text>
  <text x="860" y="296" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#9aa7b8">LaunchAgent 登录自启</text>
  <text x="860" y="348" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#5f6b7d">图片 / 文字 / 文件</text>

  <!-- github -->
  <rect x="436" y="418" width="330" height="104" rx="20" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="464" y="458" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="600" fill="#e7ecf3">GitHub Releases</text>
  <text x="464" y="490" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14" fill="#9aa7b8">APK · 24 小时自动检查</text>

  <!-- arrows -->
  <line x1="368" y1="252" x2="428" y2="252" stroke="#34d399" stroke-width="2.5" marker-end="url(#am)"/>
  <line x1="766" y1="252" x2="824" y2="252" stroke="#34d399" stroke-width="2.5" marker-end="url(#am)"/>
  <text x="376" y="238" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#34d399">HTTP</text>
  <text x="776" y="238" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="12" fill="#34d399">HTTP</text>

  <path d="M988 118 C988 52 212 52 212 112" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-dasharray="7 7" marker-end="url(#av)"/>
  <text x="512" y="72" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#a78bfa">Mac → 手机 剪贴板（长轮询推送）</text>

  <path d="M436 470 C330 470 250 440 228 368" fill="none" stroke="#64748b" stroke-width="2.2" stroke-dasharray="6 7" marker-end="url(#ag)"/>
  <text x="252" y="452" font-family="system-ui,-apple-system,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="13" fill="#7c8a9e">OTA 更新</text>
</svg>
